# Netlify settings (these override the ones in the Netlify UI).
# Netlify detects Next.js and runs its Next.js adapter, which serves the pages and API routes
# from the .next build output, so the publish folder must be .next, not dist.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Run Netlify's Next.js adapter even if the site was first set up as a plain static (Vite) site.
# Without it Netlify uploads .next as static files, which has no index.html, so "/" is a 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
